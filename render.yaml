services:
  - type: web
    name: chaser
    runtime: node
    region: singapore
    plan: free
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile --prod=false && npx pnpm@10.28.0 run build
    # Startup order (D56):
    #   1. db:push      — creates/updates the business schema (idempotent, non-interactive)
    #   2. auth:migrate — runs Better Auth migrations and repairs rateLimit schema
    #   3. db:seed-if-empty — seeds demo data only when invoices table is empty; safe on every boot
    #   4. next start   — serves the app
    # The Turso workspace persists across deploys and spin-downs.
    startCommand: npx pnpm@10.28.0 db:push && npx pnpm@10.28.0 auth:migrate && npx pnpm@10.28.0 db:seed-if-empty && npx pnpm@10.28.0 start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/chaser.db
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: LLM_MODE
        value: auto
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_MERCHANT_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: APP_BASE_URL
        value: https://paypal-ai-hackathon-9tkr.onrender.com
      # Bypass auth for hackathon judges: no login required, no Resend needed.
      - key: DEMO_PUBLIC
        value: "1"
      - key: AUTH_OWNER_EMAIL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "PayPal Hackathon <onboarding@resend.dev>"
      - key: ANTHROPIC_API_KEY
        sync: false
