services:
  - type: web
    name: chaser
    runtime: node
    region: oregon
    plan: free
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx pnpm@10.28.0 run build
    startCommand: npx pnpm@10.28.0 db:push && npx pnpm@10.28.0 auth:migrate && npx pnpm@10.28.0 db:seed && npx pnpm@10.28.0 start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/chaser.db
      - key: LLM_MODE
        value: auto
      - key: PAYPAL_MODE
        value: mock
      - key: APP_BASE_URL
        value: https://paypal-ai-hackathon-9tkr.onrender.com
      - key: AUTH_OWNER_EMAIL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "PayPal Hackathon <onboarding@resend.dev>"
      - key: ANTHROPIC_API_KEY
        sync: false

