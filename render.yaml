services:
  - type: web
    name: chaser
    runtime: node
    region: oregon
    plan: free
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npx pnpm@10.28.0 run build
    # Startup order (D56):
    #   1. db:push      — creates/updates the business schema (idempotent, non-interactive)
    #   2. auth:migrate — runs Better Auth migrations and repairs rateLimit schema
    #   3. db:seed-if-empty — seeds demo data only when invoices table is empty; safe on every boot
    #   4. next start   — serves the app
    # Render Free wipes the ephemeral filesystem on every spin-down, so steps 1–3 must
    # all run on startup to restore a usable DB from scratch in under ~10 s.
    startCommand: npx pnpm@10.28.0 db:push --accept-data-loss && npx pnpm@10.28.0 auth:migrate && npx pnpm@10.28.0 db:seed-if-empty && npx pnpm@10.28.0 start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/chaser.db
      - key: LLM_MODE
        value: auto
      - key: PAYPAL_MODE
        value: mock
      - key: APP_BASE_URL
        value: https://paypal-ai-hackathon-9tkr.onrender.com
      # Bypass auth for hackathon judges: no login required, no Resend needed.
      - key: DEMO_PUBLIC
        value: "1"
      - key: AUTH_OWNER_EMAIL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "PayPal Hackathon <onboarding@resend.dev>"
      - key: ANTHROPIC_API_KEY
        sync: false
